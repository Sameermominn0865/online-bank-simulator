<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account created</title>
</head>
<body>
    <h1>Account created</h1>
    <p>Username: <span th:text="${user.username}">user</span></p>
    <p>Role: ROLE_USER</p>
    <p>The password stored in MySQL is a BCrypt hash:</p>
    <p><code th:text="${user.password}">hash</code></p>
    <p><a href="/signup">Create another account</a></p>
</body>
</html>
