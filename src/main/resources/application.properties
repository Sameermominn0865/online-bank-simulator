spring.application.name=online-bank-simulator
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3308/onlinebanking2?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
